name: Test Agent Backbone
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install terminal test tool
        run: |
          if ! command -v tmux >/dev/null; then
            if [ "$(uname -s)" = Darwin ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
          fi
      - run: npm ci --ignore-scripts
      - run: scripts/download-engine.sh
      - run: npm test
        env:
          AGENT_BACKBONE_SKILLSHARE: ${{ github.workspace }}/vendor/skillshare
